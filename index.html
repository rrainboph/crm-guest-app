<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Гостей</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">
  <script>
    const SUPABASE_URL = 'https://dvuhuaqfgzcqoqriycyq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zGFa4777lnuhoIB1C20eIA_WTj6DOIW';
    
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Шапка -->
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Ресторанная CRM</h1>
        <p class="text-sm text-slate-500">📍 Филиал: <span class="font-medium text-slate-700">Куйбышева</span></p>
      </div>
      <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm">
        + Новый гость
      </button>
    </header>

    <!-- Сводка на Сегодня -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">🎂 Именинники</p>
        <p id="stat-birthdays" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">⭐ VIP-гости</p>
        <p id="stat-vip" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">✨ Всего гостей</p>
        <p id="stat-total" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">⚠️ Проблемные</p>
        <p id="stat-problem" class="text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Поиск -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <input type="text" id="search" oninput="filterGuests()" placeholder="🔍 Поиск гостя по имени или номеру телефона..." 
        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <!-- Список гостей -->
    <div id="guests-list" class="space-y-4">
      <p class="text-center text-slate-400 py-8">Загрузка данных...</p>
    </div>
  </div>

  <!-- Модальное окно добавления гостя -->
  <div id="guest-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900">Новый гость</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <form id="add-guest-form" onsubmit="saveGuest(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ФИО *</label>
          <input type="text" id="full_name" required placeholder="Анна Ким" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Телефон *</label>
            <input type="text" id="phone" required placeholder="+996..." class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Дата рождения</label>
            <input type="date" id="birth_date" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Категория</label>
          <select id="category" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
            <option value="NEW">Новый</option>
            <option value="REGULAR">Постоянный</option>
            <option value="VIP">VIP</option>
            <option value="PROBLEM">Проблемный</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Предпочтения (любимые блюда, стол)</label>
          <input type="text" id="preferences" placeholder="Любит капучино, стол у окна" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Важная информация (аллергии)</label>
          <input type="text" id="important_info" placeholder="Аллергия на орехи, ребенок" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Отмена</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allGuests = [];
    const BRANCH_ID = '11111111-1111-1111-1111-111111111111';

    async function loadGuests() {
      const { data: guests, error } = await supabaseClient.from('guests').select('*').order('created_at', { ascending: false });
      if (error) {
        document.getElementById('guests-list').innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl">Ошибка: ${error.message}</div>`;
        return;
      }
      allGuests = guests || [];
      updateStats();
      renderGuests(allGuests);
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = allGuests.length;
      document.getElementById('stat-vip').innerText = allGuests.filter(g => g.category === 'VIP').length;
      document.getElementById('stat-problem').innerText = allGuests.filter(g => g.category === 'PROBLEM').length;
      document.getElementById('stat-birthdays').innerText = allGuests.filter(g => g.birth_date).length;
    }

    function renderGuests(guests) {
      const container = document.getElementById('guests-list');
      if (!guests.length) {
        container.innerHTML = `<div class="p-8 bg-white rounded-xl text-center text-slate-400">Гости не найдены</div>`;
        return;
      }

      container.innerHTML = guests.map(guest => `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-lg font-bold text-slate-900">${guest.full_name}</h2>
              <p class="text-sm text-slate-500">📞 ${guest.phone}</p>
            </div>
            <span class="px-2.5 py-1 rounded text-xs font-bold ${getCategoryBadge(guest.category)}">
              ${guest.category}
            </span>
          </div>

          <div class="grid sm:grid-cols-2 gap-2 text-sm pt-2 border-t border-slate-100">
            <div>
              <span class="font-medium text-slate-700">🎂 День рождения:</span>
              <p class="text-slate-600">${guest.birth_date || 'Не указан'}</p>
            </div>
            <div>
              <span class="font-medium text-slate-700">❤️ Предпочтения:</span>
              <p class="text-slate-600">${guest.preferences || 'Нет заметок'}</p>
            </div>
          </div>

          <div class="bg-amber-50 p-3 rounded-lg text-xs text-amber-900 border border-amber-200/60">
            <strong>💬 Важная информация:</strong> ${guest.important_info || 'Особенностей нет'}
          </div>
        </div>
      `).join('');
    }

    function getCategoryBadge(cat) {
      switch(cat) {
        case 'VIP': return 'bg-indigo-100 text-indigo-800 border border-indigo-200';
        case 'PROBLEM': return 'bg-rose-100 text-rose-800 border border-rose-200';
        case 'REGULAR': return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
        default: return 'bg-slate-100 text-slate-800 border border-slate-200';
      }
    }

    function filterGuests() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = allGuests.filter(g => 
        g.full_name.toLowerCase().includes(q) || g.phone.includes(q)
      );
      renderGuests(filtered);
    }

    function toggleModal(show) {
      document.getElementById('guest-modal').classList.toggle('hidden', !show);
    }

    async function saveGuest(e) {
      e.preventDefault();
      const newGuest = {
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value,
        birth_date: document.getElementById('birth_date').value || null,
        category: document.getElementById('category').value,
        preferences: document.getElementById('preferences').value,
        important_info: document.getElementById('important_info').value,
        branch_id: BRANCH_ID
      };

      const { error } = await supabaseClient.from('guests').insert([newGuest]);
      if (error) {
        alert('Ошибка добавления: ' + error.message);
      } else {
        toggleModal(false);
        document.getElementById('add-guest-form').reset();
        loadGuests();
      }
    }

    loadGuests();
  </script>
</body>
</html>
