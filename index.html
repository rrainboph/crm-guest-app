<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRM Гостей — Сетевое управление</title>
  <!-- Внешние библиотеки -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Локальные стили -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-5 md:p-8">

  <!-- Экран Входа (Авторизация) -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 sm:p-8 text-center space-y-5">
      <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold shadow-inner">
        🔑
      </div>
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Авторизация CRM</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Введите персональный ключ доступа</p>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-4">
        <input type="password" id="access-key-input" required placeholder="Введите ключ..." 
          class="w-full text-center tracking-widest text-base sm:text-lg px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        <p id="auth-error" class="text-xs sm:text-sm text-rose-600 hidden font-medium">Неверный ключ доступа</p>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl transition shadow-md text-sm sm:text-base">
          Войти в систему
        </button>
      </form>
    </div>
  </div>

  <!-- Основной интерфейс CRM -->
  <div id="app-screen" class="hidden max-w-6xl mx-auto space-y-4 sm:space-y-6">
    <!-- Шапка -->
    <header class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 gap-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between lg:justify-start gap-2 sm:gap-4">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl font-bold text-slate-900">Ресторанная CRM</h1>
            <span id="user-role-badge" class="px-2.5 py-1 text-[11px] font-bold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-100"></span>
          </div>
          <div class="flex items-center gap-2 mt-1.5">
            <span class="text-xs text-slate-500 font-medium">📍 Филиал:</span>
            <select id="branch-select" onchange="changeBranch()" class="text-xs sm:text-sm font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option value="ALL">🌐 Все филиалы (Вся сеть)</option>
              <option value="11111111-1111-1111-1111-111111111111">ул. Куйбышева</option>
              <option value="22222222-2222-2222-2222-222222222222">пр. Чуй</option>
              <option value="33333333-3333-3333-3333-333333333333">пр. Манаса</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
        <button id="export-btn" onclick="exportToCSV()" class="flex-1 sm:flex-none bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs sm:text-sm font-semibold px-3 py-2.5 rounded-xl transition border border-slate-200 flex items-center justify-center gap-1.5">
          📥 <span class="hidden sm:inline">Экспорт</span> CSV / Excel
        </button>
        <button onclick="openCreateModal()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl transition shadow-sm text-center">
          + Новый гость
        </button>
        <button onclick="logout()" title="Выйти из системы" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs sm:text-sm font-bold px-3 py-2.5 rounded-xl transition">
          🚪 Выйти
        </button>
      </div>
    </header>

    <!-- Сводка Сегодня -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
      <div onclick="setFilter('BIRTHDAYS')" id="card-birthdays" class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-amber-400 transition active:scale-[0.98]">
        <p class="text-[11px] sm:text-xs text-slate-500 font-medium">🎂 ДР скором времени (7дн)</p>
        <p id="stat-birthdays" class="text-xl sm:text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('VIP')" id="card-vip" class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-indigo-400 transition active:scale-[0.98]">
        <p class="text-[11px] sm:text-xs text-slate-500 font-medium">⭐ VIP-гости</p>
        <p id="stat-vip" class="text-xl sm:text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('ALL')" id="card-total" class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-emerald-400 border-2 border-emerald-500 transition active:scale-[0.98]">
        <p class="text-[11px] sm:text-xs text-slate-500 font-medium">✨ Всего гостей</p>
        <p id="stat-total" class="text-xl sm:text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('INACTIVE')" id="card-inactive" class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-rose-400 transition active:scale-[0.98]">
        <p class="text-[11px] sm:text-xs text-slate-500 font-medium">⚠️ Не были > 30 дней</p>
        <p id="stat-inactive" class="text-xl sm:text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Фильтр и Поиск -->
    <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <input type="text" id="search" oninput="applyFilters()" placeholder="🔍 Поиск по имени или телефону..." 
        class="w-full sm:w-2/3 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base sm:text-sm">
      
      <div id="active-filter-badge" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-2.5 rounded-xl text-center shrink-0">
        Режим: <span id="filter-name-text" class="text-slate-800 font-bold">Все гости</span>
      </div>
    </div>

    <!-- Список гостей -->
    <div id="guests-list" class="space-y-4">
      <p class="text-center text-slate-400 py-12 text-sm">Загрузка данных...</p>
    </div>
  </div>

  <!-- Модальное окно создания / редактирования гостя -->
  <div id="guest-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3 sticky top-0 bg-white z-10">
        <h3 id="modal-title" class="text-base sm:text-lg font-bold text-slate-900">Новый гость</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-2xl font-bold p-1">&times;</button>
      </div>
      <form id="add-guest-form" onsubmit="saveGuest(event)" class="space-y-3.5">
        <input type="hidden" id="edit_guest_id">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ФИО *</label>
          <input type="text" id="full_name" required placeholder="Анна Ким" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Телефон *</label>
            <input type="text" id="phone" required placeholder="+996..." class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Дата рождения</label>
            <input type="date" id="birth_date" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Категория</label>
          <select id="category" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="NEW">Новый</option>
            <option value="REGULAR">Постоянный</option>
            <option value="VIP">VIP</option>
            <option value="PROBLEM">Проблемный</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Предпочтения (любимые блюда, стол)</label>
          <input type="text" id="preferences" placeholder="Любит кукси, стол у окна" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Важная информация (аллергии, дети)</label>
          <input type="text" id="important_info" placeholder="Без острого соуса ребенку" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2.5 text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Отмена</button>
          <button type="submit" class="px-5 py-2.5 text-xs sm:text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-sm">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно управления визитами -->
  <div id="visits-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3 sticky top-0 bg-white z-10">
        <h3 class="text-base sm:text-lg font-bold text-slate-900">История визитов</h3>
        <button onclick="toggleVisitsModal(false)" class="text-slate-400 hover:text-slate-600 text-2xl font-bold p-1">&times;</button>
      </div>
      <div id="visits-modal-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      <div class="flex justify-end pt-3 border-t">
        <button type="button" onclick="toggleVisitsModal(false)" class="px-4 py-2.5 text-xs sm:text-sm bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Подключение JS-скриптов в строгом порядке -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
