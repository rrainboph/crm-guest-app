<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Гостей — Сетевое управление</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">
  <script>
    const SUPABASE_URL = 'https://dvuhuaqfgzcqoqriycyq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zGFa4777lnuhoIB1C20eIA_WTj6DOIW';
    
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Шапка -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Ресторанная CRM</h1>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-xs text-slate-500 font-medium">📍 Филиал:</span>
          <select id="branch-select" onchange="changeBranch()" class="text-xs font-semibold bg-slate-100 border border-slate-200 rounded-md px-2 py-1 text-slate-700 focus:outline-none">
            <option value="ALL">🌐 Все филиалы (Вся сеть)</option>
            <option value="11111111-1111-1111-1111-111111111111" selected>ул. Куйбышева</option>
            <option value="22222222-2222-2222-2222-222222222222">пр. Чуй</option>
            <option value="33333333-3333-3333-3333-333333333333">пр. Манаса</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="exportToCSV()" class="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition border border-slate-200 flex items-center justify-center gap-1">
          📥 Экспорт CSV
        </button>
        <button onclick="openCreateModal()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm text-center">
          + Новый гость
        </button>
      </div>
    </header>

    <!-- Сводка Сегодня (Интерактивные виджеты) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div onclick="setFilter('BIRTHDAYS')" id="card-birthdays" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-amber-400 transition">
        <p class="text-xs text-slate-500 font-medium">🎂 ДР в скором времени (7 дн)</p>
        <p id="stat-birthdays" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('VIP')" id="card-vip" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-indigo-400 transition">
        <p class="text-xs text-slate-500 font-medium">⭐ VIP-гости</p>
        <p id="stat-vip" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('ALL')" id="card-total" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-emerald-400 border-2 border-emerald-500 transition">
        <p class="text-xs text-slate-500 font-medium">✨ Всего в базе</p>
        <p id="stat-total" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('INACTIVE')" id="card-inactive" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-rose-400 transition">
        <p class="text-xs text-slate-500 font-medium">⚠️ Не были > 30 дней</p>
        <p id="stat-inactive" class="text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Фильтр и Поиск -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
      <input type="text" id="search" oninput="applyFilters()" placeholder="🔍 Поиск гостя по имени или номеру телефона..." 
        class="w-full sm:w-2/3 px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      
      <div id="active-filter-badge" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-2 rounded-lg w-full sm:w-auto text-center">
        Режим: <span id="filter-name-text" class="text-slate-800">Все гости</span>
      </div>
    </div>

    <!-- Список гостей -->
    <div id="guests-list" class="space-y-4">
      <p class="text-center text-slate-400 py-8">Загрузка данных...</p>
    </div>
  </div>

  <!-- Модальное окно создания / редактирования гостя -->
  <div id="guest-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900">Новый гость</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <form id="add-guest-form" onsubmit="saveGuest(event)" class="space-y-3">
        <!-- Скрытое поле ID для редактирования -->
        <input type="hidden" id="edit_guest_id">

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ФИО *</label>
          <input type="text" id="full_name" required placeholder="Анна Ким" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Телефон *</label>
            <input type="text" id="phone" required placeholder="+996..." class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Дата рождения</label>
            <input type="date" id="birth_date" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Категория</label>
          <select id="category" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
            <option value="NEW">Новый</option>
            <option value="REGULAR">Постоянный</option>
            <option value="VIP">VIP</option>
            <option value="PROBLEM">Проблемный</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Предпочтения (любимые блюда, стол)</label>
          <input type="text" id="preferences" placeholder="Любит кукси, стол у окна" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Важная информация (аллергии, дети)</label>
          <input type="text" id="important_info" placeholder="Без острого соуса ребенку" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Отмена</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно управления визитами -->
  <div id="visits-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900">История визитов</h3>
        <button onclick="toggleVisitsModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div id="visits-modal-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      <div class="flex justify-end pt-3 border-t">
        <button type="button" onclick="toggleVisitsModal(false)" class="px-4 py-2 text-sm bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    let allGuests = [];
    let currentFilterMode = 'ALL'; // ALL, VIP, INACTIVE, BIRTHDAYS

    async function loadGuests() {
      const branchId = document.getElementById('branch-select').value;
      
      let query = supabaseClient.from('guests').select('*, guest_comments(*), visit_history(*)');
      
      if (branchId !== 'ALL') {
        query = query.eq('branch_id', branchId);
      }

      const { data: guests, error } = await query.order('created_at', { ascending: false });

      if (error) {
        document.getElementById('guests-list').innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl">Ошибка: ${error.message}</div>`;
        return;
      }
      allGuests = guests || [];
      updateStats();
      applyFilters();
    }

    function changeBranch() {
      loadGuests();
    }

    function isBirthdaySoon(dateStr, daysAhead = 7) {
      if (!dateStr) return false;
      const today = new Date();
      const birthDate = new Date(dateStr);
      
      const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
      }

      const diffTime = nextBirthday - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays >= 0 && diffDays <= daysAhead;
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = allGuests.length;
      document.getElementById('stat-vip').innerText = allGuests.filter(g => g.category === 'VIP').length;
      
      const now = new Date();
      const thirtyDaysAgo = new Date(now.setDate(now.getDate() - 30));

      const inactiveCount = allGuests.filter(g => {
        if (!g.visit_history || g.visit_history.length === 0) return true;
        const lastVisit = new Date(Math.max(...g.visit_history.map(v => new Date(v.visit_date))));
        return lastVisit < thirtyDaysAgo;
      }).length;
      document.getElementById('stat-inactive').innerText = inactiveCount;

      const upcomingBirthdays = allGuests.filter(g => isBirthdaySoon(g.birth_date, 7)).length;
      document.getElementById('stat-birthdays').innerText = upcomingBirthdays;
    }

    function setFilter(mode) {
      currentFilterMode = mode;
      
      ['total', 'vip', 'inactive', 'birthdays'].forEach(m => {
        document.getElementById(`card-${m}`).classList.remove('border-2', 'border-emerald-500', 'border-indigo-500', 'border-rose-500', 'border-amber-500');
      });

      const badgeText = document.getElementById('filter-name-text');

      if (mode === 'VIP') {
        document.getElementById('card-vip').classList.add('border-2', 'border-indigo-500');
        badgeText.innerText = '⭐ VIP-гости';
      } else if (mode === 'INACTIVE') {
        document.getElementById('card-inactive').classList.add('border-2', 'border-rose-500');
        badgeText.innerText = '⚠️ Не были > 30 дней';
      } else if (mode === 'BIRTHDAYS') {
        document.getElementById('card-birthdays').classList.add('border-2', 'border-amber-500');
        badgeText.innerText = '🎂 ДР в ближайшие 7 дней';
      } else {
        document.getElementById('card-total').classList.add('border-2', 'border-emerald-500');
        badgeText.innerText = 'Все гости';
      }

      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      const now = new Date();
      const thirtyDaysAgo = new Date(now.setDate(now.getDate() - 30));

      let filtered = allGuests.filter(g => {
        const matchesSearch = g.full_name.toLowerCase().includes(q) || g.phone.includes(q);
        if (!matchesSearch) return false;

        if (currentFilterMode === 'VIP') return g.category === 'VIP';
        if (currentFilterMode === 'BIRTHDAYS') return isBirthdaySoon(g.birth_date, 7);
        if (currentFilterMode === 'INACTIVE') {
          if (!g.visit_history || g.visit_history.length === 0) return true;
          const lastVisit = new Date(Math.max(...g.visit_history.map(v => new Date(v.visit_date))));
          return lastVisit < thirtyDaysAgo;
        }
        return true;
      });

      renderGuests(filtered);
    }

    function renderGuests(guests) {
      const container = document.getElementById('guests-list');
      if (!guests.length) {
        container.innerHTML = `<div class="p-8 bg-white rounded-xl text-center text-slate-400">Гости не найдены в этой категории</div>`;
        return;
      }

      container.innerHTML = guests.map(guest => {
        const visits = guest.visit_history || [];
        const comments = guest.guest_comments || [];
        
        let lastVisitStr = 'Нет визитов';
        if (visits.length > 0) {
          const sortedVisits = visits.sort((a,b) => new Date(b.visit_date) - new Date(a.visit_date));
          lastVisitStr = new Date(sortedVisits[0].visit_date).toLocaleDateString('ru-RU');
        }

        const birthdayWarning = isBirthdaySoon(guest.birth_date, 7) ? '🎉 <span class="text-amber-600 font-bold">Скоро ДР!</span>' : '';

        return `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
          <div class="flex justify-between items-start border-b pb-3 border-slate-100">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-lg font-bold text-slate-900">${guest.full_name}</h2>
                <span class="px-2.5 py-0.5 rounded text-xs font-bold ${getCategoryBadge(guest.category)}">
                  ${guest.category}
                </span>
                ${birthdayWarning}
              </div>
              <p class="text-sm text-slate-500 mt-0.5">📞 ${guest.phone}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="openEditModal('${guest.id}')" title="Редактировать данные" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                ✏️ Редактировать
              </button>
              <button onclick="openVisitsModal('${guest.id}')" title="Управление визитами" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                ⚙️ Визиты
              </button>
              <button onclick="recordVisit('${guest.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                + Отметить визит
              </button>
            </div>
          </div>

          <div class="grid sm:grid-cols-3 gap-3 text-sm">
            <div>
              <span class="font-medium text-slate-500 text-xs block">🎂 День рождения</span>
              <p class="text-slate-800 font-medium">${formatBirthDate(guest.birth_date)}</p>
            </div>
            <div>
              <span class="font-medium text-slate-500 text-xs block">📅 Последний визит</span>
              <p class="text-slate-800 font-medium">${lastVisitStr} <button onclick="openVisitsModal('${guest.id}')" class="text-xs text-indigo-600 underline font-normal ml-1">(${visits.length} всего)</button></p>
            </div>
            <div>
              <span class="font-medium text-slate-700 text-xs block">❤️ Предпочтения</span>
              <p class="text-slate-800">${guest.preferences || 'Не указаны'}</p>
            </div>
          </div>

          ${guest.important_info ? `
            <div class="bg-amber-50 p-3 rounded-lg text-xs text-amber-900 border border-amber-200/60">
              <strong>💬 Важная информация:</strong> ${guest.important_info}
            </div>
          ` : ''}

          <div class="pt-2 border-t border-slate-100 space-y-2">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Заметки управляющих</span>
            
            <div class="space-y-1.5">
              ${comments.length === 0 ? '<p class="text-xs text-slate-400 italic">Комментариев пока нет</p>' : ''}
              ${comments.map(c => `
                <div class="bg-slate-50 p-2.5 rounded-lg text-xs flex justify-between items-start border border-slate-100">
                  <p class="text-slate-700">${c.comment}</p>
                  <span class="text-[10px] text-slate-400 shrink-0 ml-2">${new Date(c.created_at).toLocaleDateString('ru-RU')}</span>
                </div>
              `).join('')}
            </div>

            <div class="flex gap-2 pt-1">
              <input type="text" id="comment-input-${guest.id}" placeholder="Добавить заметку о госте..." 
                class="flex-1 text-xs px-3 py-1.5 bg-slate-50 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <button onclick="addComment('${guest.id}')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                Сохранить
              </button>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    function formatBirthDate(dateStr) {
      if (!dateStr) return 'Не указан';
      const date = new Date(dateStr);
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    function getCategoryBadge(cat) {
      switch(cat) {
        case 'VIP': return 'bg-indigo-100 text-indigo-800 border border-indigo-200';
        case 'PROBLEM': return 'bg-rose-100 text-rose-800 border border-rose-200';
        case 'REGULAR': return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
        default: return 'bg-slate-100 text-slate-800 border border-slate-200';
      }
    }

    function toggleModal(show) {
      document.getElementById('guest-modal').classList.toggle('hidden', !show);
    }

    function toggleVisitsModal(show) {
      document.getElementById('visits-modal').classList.toggle('hidden', !show);
    }

    // Открытие модального окна для ДОБАВЛЕНИЯ
    function openCreateModal() {
      document.getElementById('modal-title').innerText = 'Новый гость';
      document.getElementById('edit_guest_id').value = '';
      document.getElementById('add-guest-form').reset();
      toggleModal(true);
    }

    // Открытие модального окна для РЕДАКТИРОВАНИЯ
    function openEditModal(guestId) {
      const guest = allGuests.find(g => g.id === guestId);
      if (!guest) return;

      document.getElementById('modal-title').innerText = 'Редактировать гостя';
      document.getElementById('edit_guest_id').value = guest.id;
      document.getElementById('full_name').value = guest.full_name || '';
      document.getElementById('phone').value = guest.phone || '';
      document.getElementById('birth_date').value = guest.birth_date || '';
      document.getElementById('category').value = guest.category || 'NEW';
      document.getElementById('preferences').value = guest.preferences || '';
      document.getElementById('important_info').value = guest.important_info || '';

      toggleModal(true);
    }

    async function recordVisit(guestId) {
      const guest = allGuests.find(g => g.id === guestId);
      const visits = guest?.visit_history || [];
      const todayDate = new Date().toDateString();

      const hasVisitToday = visits.some(v => new Date(v.visit_date).toDateString() === todayDate);

      if (hasVisitToday) {
        if (!confirm(`Для гостя ${guest.full_name} сегодня уже был отмечен визит.\nВы точно хотите добавить еще один?`)) {
          return;
        }
      }

      const { error } = await supabaseClient.from('visit_history').insert([{ guest_id: guestId }]);
      if (error) alert('Ошибка: ' + error.message);
      else loadGuests();
    }

    function openVisitsModal(guestId) {
      const guest = allGuests.find(g => g.id === guestId);
      const visits = (guest?.visit_history || []).sort((a,b) => new Date(b.visit_date) - new Date(a.visit_date));
      
      const container = document.getElementById('visits-modal-list');
      if (visits.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-xs text-center py-4">У гостя пока нет зафиксированных визитов</p>';
      } else {
        container.innerHTML = visits.map(v => `
          <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg text-xs border border-slate-200">
            <div>
              <span class="font-medium text-slate-800">🗓️ ${new Date(v.visit_date).toLocaleString('ru-RU')}</span>
            </div>
            <button onclick="deleteVisit('${v.id}', '${guestId}')" class="text-rose-600 hover:text-rose-800 font-bold px-2 py-1 rounded bg-rose-50 hover:bg-rose-100 transition">
              Удалить
            </button>
          </div>
        `).join('');
      }
      toggleVisitsModal(true);
    }

    async function deleteVisit(visitId, guestId) {
      if (!confirm('Отменить и удалить эту запись о визите?')) return;

      const { error } = await supabaseClient.from('visit_history').delete().eq('id', visitId);
      if (error) {
        alert('Ошибка удаления: ' + error.message);
      } else {
        await loadGuests();
        openVisitsModal(guestId);
      }
    }

    async function addComment(guestId) {
      const input = document.getElementById(`comment-input-${guestId}`);
      const text = input.value.trim();
      if (!text) return;

      const { error } = await supabaseClient.from('guest_comments').insert([{ guest_id: guestId, comment: text }]);
      if (error) alert('Ошибка: ' + error.message);
      else loadGuests();
    }

    // Сохранение (Создание или Обновление)
    async function saveGuest(e) {
      e.preventDefault();
      const guestId = document.getElementById('edit_guest_id').value;
      const currentBranch = document.getElementById('branch-select').value;
      const targetBranch = currentBranch === 'ALL' ? '11111111-1111-1111-1111-111111111111' : currentBranch;

      const guestData = {
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value,
        birth_date: document.getElementById('birth_date').value || null,
        category: document.getElementById('category').value,
        preferences: document.getElementById('preferences').value,
        important_info: document.getElementById('important_info').value
      };

      let error;
      if (guestId) {
        // Редактирование существующего
        ({ error } = await supabaseClient.from('guests').update(guestData).eq('id', guestId));
      } else {
        // Добавление нового
        guestData.branch_id = targetBranch;
        ({ error } = await supabaseClient.from('guests').insert([guestData]));
      }

      if (error) {
        alert('Ошибка сохранения: ' + error.message);
      } else {
        toggleModal(false);
        document.getElementById('add-guest-form').reset();
        loadGuests();
      }
    }

    function exportToCSV() {
      if (!allGuests.length) return alert('Нет данных для экспорта');

      let csv = 'ФИО,Телефон,Дата Рождения,Категория,Предпочтения,Важное,Визитов Всего\n';
      allGuests.forEach(g => {
        const visitsCount = g.visit_history ? g.visit_history.length : 0;
        csv += `"${g.full_name}","${g.phone}","${g.birth_date || ''}","${g.category}","${g.preferences || ''}","${g.important_info || ''}",${visitsCount}\n`;
      });

      const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `guests_export_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    loadGuests();
  </script>
</body>
</html>
