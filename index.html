<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRM Гостей — Сетевое управление</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-5 md:p-8 font-sans antialiased">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Экран Входа -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 sm:p-8 text-center space-y-5 border border-slate-100">
      <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner border border-indigo-100">
        <i data-lucide="key-round" class="w-7 h-7"></i>
      </div>
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Авторизация CRM</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Введите PIN-код доступа</p>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-4">
        <input type="password" id="access-key-input" required placeholder="Введите PIN..." 
          class="w-full text-center tracking-widest text-base sm:text-lg px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition">
        <p id="auth-error" class="text-xs sm:text-sm text-rose-600 hidden font-medium flex items-center justify-center gap-1">
          <i data-lucide="alert-circle" class="w-4 h-4"></i> Неверный PIN-код
        </p>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl transition shadow-md text-sm sm:text-base flex items-center justify-center gap-2">
          <span>Войти в систему</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Основной экран CRM -->
  <div id="app-screen" class="hidden max-w-6xl mx-auto space-y-4 sm:space-y-6">
    <header class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 gap-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between lg:justify-start gap-2 sm:gap-4">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="building-2" class="w-5 h-5 text-indigo-600"></i> Ресторанная CRM
            </h1>
            <span id="user-role-badge" class="px-2.5 py-1 text-[11px] font-bold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1"></span>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i> Филиал:
            </span>
            <select id="branch-select" onchange="changeBranch()" class="text-xs sm:text-sm font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
            </select>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
        <button id="export-btn" onclick="exportToCSV()" class="flex-1 sm:flex-none bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl transition border border-slate-200 flex items-center justify-center gap-2">
          <i data-lucide="download" class="w-4 h-4 text-slate-500"></i> <span class="hidden sm:inline">Экспорт</span> CSV
        </button>
        <button onclick="openCreateModal()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1.5 active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i> Новый гость
        </button>
        <button onclick="logout()" title="Выйти" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs sm:text-sm font-bold px-3 py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Сводка -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
      <div onclick="setFilter('BIRTHDAYS')" id="card-birthdays" class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-amber-400 transition-all active:scale-[0.98]">
        <div class="flex items-center justify-between">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">🎂 Скоро ДР (3дн)</p>
          <i data-lucide="cake" class="w-4 h-4 text-amber-500"></i>
        </div>
        <p id="stat-birthdays" class="text-xl sm:text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('VIP')" id="card-vip" class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-indigo-400 transition-all active:scale-[0.98]">
        <div class="flex items-center justify-between">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">⭐ VIP-гости</p>
          <i data-lucide="star" class="w-4 h-4 text-indigo-500"></i>
        </div>
        <p id="stat-vip" class="text-xl sm:text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('ALL')" id="card-total" class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-emerald-400 border-2 border-emerald-500 transition-all active:scale-[0.98]">
        <div class="flex items-center justify-between">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">✨ Всего гостей</p>
          <i data-lucide="users" class="w-4 h-4 text-emerald-500"></i>
        </div>
        <p id="stat-total" class="text-xl sm:text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div onclick="setFilter('INACTIVE')" id="card-inactive" class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 cursor-pointer hover:border-rose-400 transition-all active:scale-[0.98]">
        <div class="flex items-center justify-between">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">⚠️ Не были > 30дн</p>
          <i data-lucide="user-minus" class="w-4 h-4 text-rose-500"></i>
        </div>
        <p id="stat-inactive" class="text-xl sm:text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Поиск -->
    <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="relative w-full sm:w-2/3">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="search" oninput="applyFilters()" placeholder="Поиск по имени или телефону..." 
          class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base sm:text-sm transition">
      </div>
      <div id="active-filter-badge" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-2.5 rounded-xl text-center shrink-0 border border-slate-200/60 flex items-center justify-center gap-1.5">
        <i data-lucide="filter" class="w-3.5 h-3.5 text-slate-400"></i> Режим: <span id="filter-name-text" class="text-slate-800 font-bold">Все гости</span>
      </div>
    </div>

    <div id="guests-list" class="space-y-4"></div>
  </div>

  <!-- Модальное окно создания/редактирования гостя -->
  <div id="guest-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-4 border border-slate-100">
      <div class="flex justify-between items-center border-b pb-3 sticky top-0 bg-white z-10">
        <h3 id="modal-title" class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> Новый гость
        </h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="add-guest-form" onsubmit="saveGuest(event)" class="space-y-3.5">
        <input type="hidden" id="edit_guest_id">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ФИО *</label>
          <input type="text" id="full_name" required placeholder="Анна Ким" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Телефон *</label>
            <input type="text" id="phone" required placeholder="+996..." oninput="formatPhoneInput(event)" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Дата рождения</label>
            <input type="date" id="birth_date" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Категория</label>
          <select id="category" class="w-full px-3.5 py-2.5 border rounded-xl text-base sm:text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="NEW">Новый</option>
            <option value="REGULAR">Постоянный</option>
            <option value="VIP">VIP</option>
            <option value="PROBLEM">Проблемный</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2.5 text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Отмена</button>
          <button type="submit" class="px-5 py-2.5 text-xs sm:text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно истории визитов -->
  <div id="visits-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-4 border border-slate-100">
      <div class="flex justify-between items-center border-b pb-3 sticky top-0 bg-white z-10">
        <h3 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i> История визитов
        </h3>
        <button onclick="toggleVisitsModal(false)" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="visits-modal-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      <div class="flex justify-end pt-3 border-t">
        <button type="button" onclick="toggleVisitsModal(false)" class="px-4 py-2.5 text-xs sm:text-sm bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Confirm Модалка -->
  <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4 text-center border border-slate-100">
      <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 id="confirm-title" class="text-base font-bold text-slate-900">Подтвердите действие</h3>
        <p id="confirm-text" class="text-xs text-slate-500 mt-1 leading-relaxed">Вы уверены?</p>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeConfirmModal()" class="flex-1 px-4 py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Отмена</button>
        <button id="confirm-ok-btn" class="flex-1 px-4 py-2.5 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-xl shadow-sm">Подтвердить</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
